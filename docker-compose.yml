services:
  web:
    image: node:24-bookworm-slim
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      # Linux node_modules live in a volume so they never mix with the macOS host.
      - node_modules:/app/node_modules
    env_file:
      - path: .env
        required: false

volumes:
  node_modules:
